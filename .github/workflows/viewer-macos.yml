name: macOS viewer

# Builds Switch Frame Tap.app for Apple Silicon and Intel Macs
# (tools/raw-recv/build-macos.sh). Run by hand from the Actions tab, or on a
# version tag; the zips are the run's artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/macos']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
          - runner: macos-15-intel   # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: brew install libusb pkg-config nasm cmake
      - name: Build
        run: |
          v="${GITHUB_REF_NAME#v}"
          bash tools/raw-recv/build-macos.sh "${v//\//-}"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-macos-${{ matrix.runner }}
          path: dist/switch-frame-tap-*-macos-*.zip
